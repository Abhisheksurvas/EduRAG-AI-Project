    <script>
      // Apply saved theme before first paint to avoid a flash.
      (function () {
        try {
          if (localStorage.getItem('edurag-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
